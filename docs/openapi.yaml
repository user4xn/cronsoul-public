              type: object
              properties:
                attempt_no:
                  type: integer
                status:
                  type: string
                http_status:
                  type: integer
                  nullable: true
                duration_ms:
                  type: integer
                  nullable: true
                error:
                  type: string
                  nullable: true
                started_at:
                  type: string
                  format: date-time
                  nullable: true
                finished_at:
                  type: string
                  format: date-time
                  nullable: true
                response_excerpt:
                  type: string
                  nullable: true
