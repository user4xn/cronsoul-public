        simulated_time:
          type: string
          format: date-time
          nullable: true
        dry_run:
          type: boolean
        response_truncated:
          type: boolean
        assertion_passed:
          type: boolean
          nullable: true
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
        error:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        job_name:
          type: string
        job_key:
          type: string
        job_method:
          type: string
        job_url:
          type: string
    RunDetail:
      allOf:
      - $ref: '#/components/schemas/Run'
      - type: object
        properties:
          request_excerpt:
            type: string
            nullable: true
          response_excerpt:
            type: string
            nullable: true
          attempts_detail:
            type: array
