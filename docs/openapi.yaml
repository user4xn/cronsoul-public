    Channel:
      type: object
      properties:
        id:
          type: string
        kind:
          type: string
          enum:
          - smtp
          - telegram
          - webhook
        name:
          type: string
        enabled:
          type: boolean
        events:
          type: array
          items:
            type: string
        meta:
          type: object
          nullable: true
          description: Non-secret summary only; credentials are encrypted at rest and never returned
          properties:
            host:
              type: string
            port:
              type: integer
            from:
              type: string
            tls:
              type: boolean
            targets:
              type: array
              items:
                type: string
    ChannelInput:
      type: object
      required:
      - kind
      - name
      properties:
        kind:
          type: string
          enum:
          - smtp
          - telegram
          - webhook
        name:
          type: string
        enabled:
          type: boolean
        events:
          type: array
          description: Subset of failure, recovered, missed_run, assertion_failed, manual_run. Empty means the first four; manual_run (successful Play) is opt-in.
          items:
            type: string
            enum: [failure, recovered, missed_run, assertion_failed, manual_run]
        config:
          type: object
          description: Transport credentials; encrypted before storage
          properties:
            host:
              type: string
            port:
              type: integer
            user:
              type: string
            pass:
              type: string
              format: password
            from:
              type: string
            tls:
              type: boolean
            bot_token:
              type: string
              format: password
            chat_ids:
